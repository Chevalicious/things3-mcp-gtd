[project]
name = "things3-mcp-gtd"
version = "2.0.1"
description = "Local MCP server for Things 3 on macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT License" }
authors = [
    { name = "Chevalicious", email = "Chevalicious@users.noreply.github.com" },
]
keywords = [
    "mcp",
    "things3",
    "things",
    "task-management",
    "productivity",
    "fastmcp",
    "macos",
    "apple",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: MacOS",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=3.4.11,<4",
    "mcp>=1.30,<2",
    "pydantic-settings>=2.0.0",
    "things-py>=1.1,<2",
    "starlette>=0.52.1,<2",
    "uvicorn>=0.40,<1",
]

[project.urls]
"Homepage" = "https://github.com/Chevalicious/things3-mcp-gtd"
"Bug Tracker" = "https://github.com/Chevalicious/things3-mcp-gtd/issues"
"Changelog" = "https://github.com/Chevalicious/things3-mcp-gtd/blob/main/CHANGELOG.md"
"Documentation" = "https://github.com/Chevalicious/things3-mcp-gtd#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/things_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/things_mcp",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.envs.default]
dependencies = ["pytest", "pytest-cov", "pytest-asyncio", "ruff", "build", "twine"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.scripts]
things3-mcp = "things_mcp.things_fast_server:main"
things3-mcp-gtd = "things_mcp.things_fast_server:main"

[tool.hatch.envs.default.scripts]
test = "python -m pytest tests"
lint = "ruff check ."
format = "ruff format ."
build = "python -m build"
publish = "twine upload dist/*"
clean = "rm -rf dist build *.egg-info"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]

[tool.ruff]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
