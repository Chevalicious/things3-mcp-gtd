  <text x="64" y="216" fill="#172b27" font-family="Georgia, serif" font-size="53">A little more room.</text>
  <text x="66" y="286" fill="#486350" font-family="Arial, Helvetica, sans-serif" font-size="21">Your lists. Your Mac. A helping hand.</text>
